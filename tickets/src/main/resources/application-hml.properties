spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://162.240.178.234:5432/tickets_db_hml
spring.datasource.username=${DB_USERNAME_HML:tickets_user_html}
spring.datasource.password=${DB_PASSWORD_HML}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=tickets_api
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.format_sql=false
spring.flyway.enabled=true
spring.flyway.schemas=tickets_api
spring.flyway.table-schema=flyway_history
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:default-secret}